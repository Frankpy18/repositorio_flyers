<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio Cross Selling</title>
    <style>
        :root { --primary: #d52b1e; --dark: #333; --light: #f4f4f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light); margin: 0; padding: 0; color: var(--dark); }
        
        header { background-color: var(--primary); color: white; padding: 25px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 1.8em; }
        header p { margin: 5px 0 0 0; opacity: 0.9; font-size: 0.95em; }

        .status-bar { text-align: center; padding: 10px 20px; font-size: 0.85em; color: #777; background: #fff; border-bottom: 1px solid #eee; }
        .status-bar.error { color: var(--primary); font-weight: 600; }

        .upload-section { text-align: center; background: #fff; padding: 25px; border-bottom: 1px solid #ddd; }
        .upload-btn { background: var(--dark); color: white; padding: 12px 25px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .upload-btn:hover { background: #555; }
        .refresh-btn { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85em; font-weight: 600; }
        .refresh-btn:hover { background: var(--primary); color: #fff; }

        .controls { max-width: 1100px; margin: 25px auto 10px auto; padding: 0 20px; display: none; flex-direction: column; gap: 15px; }
        .controls-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        #searchInput { width: 100%; box-sizing: border-box; padding: 12px 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; outline: none; transition: border-color 0.3s; }
        #searchInput:focus { border-color: var(--primary); }

        .weeks-tabs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn-week { padding: 10px 18px; background-color: #e0e0e0; border: none; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9em; transition: all 0.3s; text-transform: capitalize; color: #555; }
        .btn-week.active, .btn-week:hover { background-color: var(--primary); color: white; box-shadow: 0 2px 5px rgba(213, 43, 30, 0.3); }

        .gallery { max-width: 1200px; margin: 20px auto 40px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .flyer-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.06); transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; cursor: pointer; }
        .flyer-card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.12); }
        .flyer-img { width: 100%; height: 280px; object-fit: cover; background-color: #eee; }
        
        .flyer-info { padding: 15px; text-align: center; border-top: 1px solid #eee; }
        .flyer-name { margin: 0 0 6px 0; font-size: 1.05em; text-transform: capitalize; }
        .tag-week { display: inline-block; font-size: 0.75em; color: var(--primary); text-transform: capitalize; font-weight: bold; background: #ffebeb; padding: 3px 8px; border-radius: 4px; }

        .no-results { text-align: center; grid-column: 1 / -1; font-size: 1.1em; color: #777; padding: 40px; }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); justify-content: center; align-items: center; }
        .modal-container { display: flex; flex-direction: row; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); width: 95%; max-width: 1250px; height: 85vh; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: zoomIn 0.3s ease; }
        
        .modal-left { flex: 1.4; background: rgba(0, 0, 0, 0.05); display: flex; justify-content: center; align-items: center; padding: 15px; }
        .modal-left img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .modal-right { flex: 1.1; padding: 35px; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #e5e5e5; overflow-y: auto; }
        .modal-right h2 { margin-top: 0; font-size: 1.4em; color: var(--dark); border-bottom: 2px solid var(--primary); padding-bottom: 10px; line-height: 1.3; }
        #txtDescription { flex-grow: 1; margin: 15px 0; font-size: 15px; line-height: 1.6; color: #444; white-space: pre-wrap; }
        
        .badge-semana { display: inline-block; font-size: 0.55em; text-transform: capitalize; letter-spacing: 0.5px; background: #ffebeb; color: var(--primary); padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; font-weight: 700; }
        
        .close-btn { position: absolute; top: 15px; right: 25px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 1001; }
        .close-btn:hover { color: var(--primary); }

        @media (max-width: 768px) {
            .modal-container { flex-direction: column; height: 90vh; }
            .modal-left { flex: 1; height: 45%; }
            .modal-right { flex: 1; height: 55%; border-left: none; border-top: 1px solid #ddd; padding: 20px; }
        }
        @keyframes zoomIn { from {transform: scale(0.95); opacity: 0;} to {transform: scale(1); opacity: 1;} }
    </style>
</head>
<body>

    <header>
        <h1>Campaña Cross Selling</h1>
        <p>Repositorio y Guías Semanales para Asesores</p>
    </header>

    <div class="status-bar" id="statusBar">Cargando flyers automáticamente...</div>

    <div class="upload-section" id="uploadSection" style="display:none;">
        <p style="margin-top:0;">No se pudo cargar la carpeta automáticamente. Haz clic abajo y selecciona la carpeta manualmente.</p>
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;" />
        <button class="upload-btn" onclick="document.getElementById('folderInput').click()">📁 Cargar Carpeta de Flyers (manual)</button>
    </div>

    <div class="controls" id="controlsSection">
        <div class="controls-top">
            <input type="text" id="searchInput" placeholder="Buscar por tema o nombre del flyer..." style="flex:1;">
        </div>
        <div class="weeks-tabs" id="weeksButtons"></div>
    </div>

    <main class="gallery" id="gallery"></main>

    <!-- MODAL -->
    <div id="imageModal" class="modal">
        <span class="close-btn" id="closeModal">&times;</span>
        <div class="modal-container">
            <div class="modal-left">
                <img id="modalImg">
            </div>
            <div class="modal-right">
                <h2 id="caption"></h2>
                <div id="txtDescription"></div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // CONFIGURACIÓN
        // Los flyers están en la MISMA carpeta que este index.html (raíz del
        // repo). El script lee la lista de archivos desde "manifest.json",
        // un archivo de texto que tú mantienes junto a index.html.
        // =====================================================================
        const ROOT_FOLDER = './';
        const MANIFEST_FILE = ROOT_FOLDER + 'manifest.json';

        let flyersData = [];
        let semanasUnicas = new Set(["todas"]);

        const gallery = document.getElementById('gallery');
        const searchInput = document.getElementById('searchInput');
        const weeksButtons = document.getElementById('weeksButtons');
        const controlsSection = document.getElementById('controlsSection');
        const uploadSection = document.getElementById('uploadSection');
        const statusBar = document.getElementById('statusBar');
        const folderInput = document.getElementById('folderInput');
        const refreshBtn = document.getElementById('refreshBtn');

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const captionText = document.getElementById('caption');
        const txtDescription = document.getElementById('txtDescription');
        const closeModal = document.getElementById('closeModal');

        // Toma la primera línea no vacía del .txt como título. Si no hay
        // texto, usa el nombre derivado del archivo como respaldo.
        function extraerTitulo(textoScript, nombreRespaldo) {
            if (!textoScript || !textoScript.trim()) return nombreRespaldo;
            const primeraLinea = textoScript.trim().split('\n')[0].trim();
            return primeraLinea || nombreRespaldo;
        }

        // ---------------------------------------------------------------
        // CARGA AUTOMÁTICA
        // Lee la lista de archivos desde manifest.json. Si no existe o está
        // mal formado, cae al botón de carga manual como respaldo.
        // ---------------------------------------------------------------
        async function obtenerListaArchivos() {
            const r = await fetch(MANIFEST_FILE, { cache: 'no-store' });
            if (!r.ok) {
                throw new Error('No se encontró "' + MANIFEST_FILE + '" (HTTP ' + r.status + '). Sube ese archivo al repo, junto a index.html.');
            }
            const lista = await r.json();
            if (!Array.isArray(lista) || lista.length === 0) {
                throw new Error('"' + MANIFEST_FILE + '" existe pero está vacío o mal formado. Debe ser una lista como ["flyer1-semana1.jpeg", "flyer1-semana1.txt"].');
            }
            return lista;
        }

        async function cargarFlyersAutomaticamente() {
            statusBar.classList.remove('error');
            statusBar.textContent = 'Cargando flyers desde "' + ROOT_FOLDER + '"...';
            gallery.innerHTML = '';

            try {
                const archivos = await obtenerListaArchivos();

                const imagenes = archivos.filter(f => /\.(jpe?g|png|webp)$/i.test(f));
                const textos = archivos.filter(f => f.toLowerCase().endsWith('.txt'));

                if (imagenes.length === 0) {
                    throw new Error('No se encontraron imágenes (.jpg, .png, .webp) en "' + ROOT_FOLDER + '".');
                }

                // Descargar el contenido de todos los .txt en paralelo
                let textFiles = {};
                await Promise.all(textos.map(async (t) => {
                    try {
                        const r = await fetch(ROOT_FOLDER + t, { cache: 'no-store' });
                        textFiles[t] = r.ok ? await r.text() : '';
                    } catch (e) {
                        textFiles[t] = '';
                    }
                }));

                flyersData = [];
                semanasUnicas = new Set(["todas"]);

                imagenes.forEach(imgName => {
                    let baseName = imgName.substring(0, imgName.lastIndexOf('.'));
                    let splitIndex = baseName.lastIndexOf('-');

                    let nombre, semana;
                    if (splitIndex !== -1) {
                        nombre = baseName.substring(0, splitIndex).replace(/_/g, ' ');
                        semana = baseName.substring(splitIndex + 1).toLowerCase();
                    } else {
                        nombre = baseName.replace(/_/g, ' ');
                        semana = "semana 1";
                    }

                    semanasUnicas.add(semana);
                    let txtName = baseName + '.txt';
                    let scriptTexto = textFiles[txtName] || "";

                    flyersData.push({
                        originalFile: imgName,
                        displayName: nombre,
                        title: extraerTitulo(scriptTexto, nombre),
                        week: semana,
                        url: ROOT_FOLDER + imgName,
                        script: scriptTexto
                    });
                });

                generarPestañasSemanas();
                renderFlyers();

                uploadSection.style.display = "none";
                controlsSection.style.display = "flex";
            } catch (err) {
                console.error(err);
                statusBar.classList.add('error');
                statusBar.textContent = '⚠️ ' + err.message + ' — usa la carga manual mientras tanto.';
                uploadSection.style.display = "block";
                controlsSection.style.display = "none";
                gallery.innerHTML = '<div class="no-results">Por favor, carga tu carpeta de imágenes manualmente para comenzar.</div>';
            }
        }

        // ---------------------------------------------------------------
        // CARGA MANUAL (se mantiene como respaldo por si la automática falla)
        // ---------------------------------------------------------------
        folderInput.addEventListener('change', async (e) => {
            const archivos = Array.from(e.target.files);
            flyersData = [];
            semanasUnicas = new Set(["todas"]);
            let textFiles = {};

            const imagenes = archivos.filter(f => f.type.startsWith('image/') || f.name.match(/\.(jpeg|jpg|png)$/i));
            const textos = archivos.filter(f => f.name.endsWith('.txt'));

            for (let t of textos) {
                textFiles[t.name] = await t.text();
            }

            imagenes.forEach(img => {
                let baseName = img.name.substring(0, img.name.lastIndexOf('.'));
                let splitIndex = baseName.lastIndexOf('-');
                
                let nombre, semana;
                if (splitIndex !== -1) {
                    nombre = baseName.substring(0, splitIndex).replace(/_/g, ' ');
                    semana = baseName.substring(splitIndex + 1).toLowerCase();
                } else {
                    nombre = baseName.replace(/_/g, ' ');
                    semana = "semana 1";
                }

                semanasUnicas.add(semana);
                let txtName = baseName + '.txt';
                let scriptTexto = textFiles[txtName] || "";

                flyersData.push({
                    originalFile: img.name,
                    displayName: nombre,
                    title: extraerTitulo(scriptTexto, nombre),
                    week: semana,
                    url: URL.createObjectURL(img),
                    script: scriptTexto
                });
            });

            generarPestañasSemanas();
            renderFlyers();

            uploadSection.style.display = "none";
            controlsSection.style.display = "flex";
            statusBar.textContent = flyersData.length + ' flyer(s) cargados manualmente.';
            statusBar.classList.remove('error');
        });

        function generarPestañasSemanas() {
            weeksButtons.innerHTML = '';
            
            const listaOrdenada = Array.from(semanasUnicas).sort((a, b) => {
                if (a === 'todas') return -1;
                if (b === 'todas') return 1;
                return a.localeCompare(b, undefined, { numeric: true });
            });

            listaOrdenada.forEach(sem => {
                const btn = document.createElement('button');
                btn.className = sem === 'todas' ? 'btn-week active' : 'btn-week';
                btn.dataset.week = sem;
                btn.innerText = sem === 'todas' ? 'Todas las Semanas' : sem.replace(/(\D+)(\d+)/, '$1 $2');
                
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.btn-week').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    renderFlyers(e.target.dataset.week, searchInput.value);
                });
                weeksButtons.appendChild(btn);
            });
        }

        function renderFlyers(filterWeek = 'todas', searchTerm = '') {
            gallery.innerHTML = ''; 
            const filteredFlyers = flyersData.filter(f => {
                const matchWeek = filterWeek === 'todas' || f.week === filterWeek;
                const term = searchTerm.toLowerCase();
                const matchSearch = f.title.toLowerCase().includes(term) || f.displayName.toLowerCase().includes(term);
                return matchWeek && matchSearch;
            });

            if (filteredFlyers.length === 0) {
                gallery.innerHTML = '<div class="no-results">No se encontraron flyers para esta búsqueda.</div>';
                return;
            }

            filteredFlyers.forEach(flyer => {
                const card = document.createElement('div');
                card.className = 'flyer-card';
                card.innerHTML = `
                    <img src="${flyer.url}" class="flyer-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23ddd\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' fill=\\'%23666\\'>Sin Imagen</text></svg>'">
                    <div class="flyer-info">
                        <h3 class="flyer-name">${flyer.title}</h3>
                        <span class="tag-week">${flyer.week.replace(/(\D+)(\d+)/, '$1 $2')}</span>
                    </div>
                `;
                
                card.addEventListener('click', () => abrirModal(flyer));
                gallery.appendChild(card);
            });
        }

        function abrirModal(flyer) {
            modal.style.display = "flex";
            modalImg.src = flyer.url;
            captionText.innerHTML = "";
            txtDescription.innerText = "";

            captionText.innerHTML = `
                <div>
                    <span class="badge-semana">${flyer.week.replace(/(\D+)(\d+)/, '$1 $2')}</span>
                </div>
                ${flyer.title}
            `;

            if (flyer.script.trim() !== "") {
                const cuerpoTexto = flyer.script.trim().split('\n').slice(1).join('\n').trim();
                txtDescription.innerText = cuerpoTexto || "No se ha encontrado texto descriptivo para este flyer.";
            } else {
                txtDescription.innerText = "No se ha encontrado texto descriptivo para este flyer.";
            }
        }

        searchInput.addEventListener('input', (e) => {
            const currentWeek = document.querySelector('.btn-week.active').dataset.week;
            renderFlyers(currentWeek, e.target.value);
        });

        refreshBtn.addEventListener('click', cargarFlyersAutomaticamente);

        closeModal.addEventListener('click', () => modal.style.display = "none");
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = "none";
        });

        // Arranca la carga automática apenas se abre la página
        window.addEventListener('DOMContentLoaded', cargarFlyersAutomaticamente);
    </script>
</body>
</html>
